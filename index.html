<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="shared/sequentia-mark.svg">
<title>SeqDEX · Markets</title>
<script>
  // A link to a pair (index.html?pair=GOLD-USDX) opens that pair's page.
  if (new URLSearchParams(location.search).has('pair')) location.replace('market.html' + location.search);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/terminal.css">
</head>
<body class="surface-market term-page">
<div class="wrap">
  <header class="topbar"></header>
  <div class="t-card t-markets">
    <div class="t-stats">
      <h1>Markets</h1>
      <div class="t-stat"><span class="t-k">Markets</span><span class="v" id="stMarkets">-</span></div>
      <div class="t-stat"><span class="t-k">24h volume</span><span class="v" id="stVolume">-</span></div>
      <div class="t-stat"><span class="t-k">Trades 24h</span><span class="v" id="stTrades">-</span></div>
    </div>
    <div id="tickers"></div>
    <p class="t-small" style="padding:10px 16px 14px">Each price is the last trade, in the asset named beside it. Volume is in US dollars, the same for both rows of a market.</p>
  </div>
</div>
<script type="module">
  import { initChrome, footer } from './shared/app.js';
  import { runMarketsPage } from './js/markets-page.js';
  await initChrome('index.html');
  footer();
  runMarketsPage();
</script>
</body>
</html>
